name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compiler l'APK avec Gradle (Projet extrait)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Lancer la compilation de l'APK
        run: |
          cd projet-extrait
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sauvegarder l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-stock-apk
          path: projet-extrait/app/build/outputs/apk/debug/app-debug.apk
