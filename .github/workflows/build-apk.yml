name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle sur le serveur
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Generer le wrapper et compiler l'APK
        run: |
          cd projet-extrait
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tahiry-stock-apk
          path: projet-extrait/app/build/outputs/apk/debug/app-debug.apk
