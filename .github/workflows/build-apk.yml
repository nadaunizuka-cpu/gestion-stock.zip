name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Compiler l'APK avec Gradle
        run: gradle assembleDebug
        working-directory: projet-extrait

      - name: Sauvegarder l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-stock-apk
          path: projet-extrait/app/build/outputs/apk/debug/app-debug.apk
