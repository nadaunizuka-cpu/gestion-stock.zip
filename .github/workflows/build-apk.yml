name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Se placer dans le dossier du projet extrait
        run: cd projet-extrait

      - name: Rendre Gradleexecutable
        run: chmod +x projet-extrait/gradlew || true

      - name: Compiler l'APK avec Gradle
        run: |
          cd projet-extrait
          ./gradlew assembleDebug

      - name: Sauvegarder l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-stock-apk
          path: projet-extrait/app/build/outputs/apk/debug/app-debug.apk
          
