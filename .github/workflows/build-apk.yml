name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Gradle globalement
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Générer le wrapper et compiler l'APK
        run: |
          cd projet-extrait
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sauvegarder l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-stock-apk
          path: projet-extrait/app/build/outputs/apk/debug/app-debug.apk
          
