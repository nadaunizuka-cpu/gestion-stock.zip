
name: Extraire gestion-stock.zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire le fichier ZIP
        run: |
          if [ ! -f "gestion-stock.zip" ]; then
            echo "Erreur : gestion-stock.zip introuvable"
            exit 1
          fi

          mkdir -p projet-extrait
          unzip -o gestion-stock.zip -d projet-extrait

      - name: Enregistrer les fichiers extraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add projet-extrait

          if git diff --cached --quiet; then
            echo "Aucun nouveau fichier a enregistrer."
          else
            git commit -m "Extraction automatique du projet"
            git push
          fi
